# Local stack: PostgreSQL and the gateway. Values come from .env, created by `make up`.
name: aduana

services:
  postgres:
    image: postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    environment:
      POSTGRES_DB: aduana
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "aduana"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  gateway:
    build: .
    image: aduana-gateway:local
    depends_on:
      postgres:
        condition: service_healthy
      crm:
        condition: service_healthy
      payments:
        condition: service_healthy
      webfetch:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8780}:8080"
    environment:
      SPRING_CONFIG_IMPORT: optional:file:/etc/aduana/upstreams.yaml
      ADUANA_POLICY_DIRECTORY: /etc/aduana/policy
      ADUANA_DATABASE_URL: jdbc:postgresql://postgres:5432/aduana
      ADUANA_DATABASE_USER: ${POSTGRES_USER}
      ADUANA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      ADUANA_MASTER_KEY: ${ADUANA_MASTER_KEY:?set in .env}
      ADUANA_BOOTSTRAP_ADMIN_EMAIL: ${ADUANA_ADMIN_EMAIL:-}
      ADUANA_BOOTSTRAP_ADMIN_PASSWORD: ${ADUANA_ADMIN_PASSWORD:-}
    volumes:
      - ./deploy/upstreams.demo.yaml:/etc/aduana/upstreams.yaml:ro
      - ./demo/policy:/etc/aduana/policy:ro

  crm: &demo-server
    build:
      context: .
      dockerfile: demo/Dockerfile
    image: aduana-demo:local
    command: ["node", "dist/servers/crm/server.js"]
    environment:
      PORT: "3001"
      ALLOWED_HOSTS: crm,localhost,127.0.0.1
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+process.env.PORT+'/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 20

  payments:
    <<: *demo-server
    command: ["node", "dist/servers/payments/server.js"]
    environment:
      PORT: "3002"
      ALLOWED_HOSTS: payments,localhost,127.0.0.1

  webfetch:
    <<: *demo-server
    command: ["node", "dist/servers/webfetch/server.js"]
    environment:
      PORT: "3003"
      ALLOWED_HOSTS: webfetch,localhost,127.0.0.1

  agent:
    image: aduana-demo:local
    profiles: ["tools"]
    entrypoint: ["node", "dist/agent/agent.js"]

volumes:
  postgres-data:
