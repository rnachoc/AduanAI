# Local stack: PostgreSQL and the gateway. Values come from .env, created by `make up`.
name: aduana

services:
  postgres:
    image: postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    environment:
      POSTGRES_DB: aduana
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "aduana"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  gateway:
    build: .
    image: aduana-gateway:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8780}:8080"

volumes:
  postgres-data:
