version: 1
defaults:
  decision: deny
rules:
  - id: payments-need-finance
    match:
      tool: { server: bank, name: pay }
    effect: require_approval
    approval: { approvers_group: finance, expires_in: 15m }
  - id: quick-approvals-expire-fast
    match:
      tool: { server: bank, name: quick }
    effect: require_approval
    approval: { approvers_group: finance, expires_in: 4s }
