# The labelled set the detectors are measured on (docs/detectors.md). Every value is a test value:
# example.com mail, placeholder phones, DNIs computed for this file, IBANs with the non-existent
# country XX or the published ISO 13616 examples, card test numbers, and fake tokens in real formats.
# A positive must be found exactly; a negative must not be reported at all.
email:
  positives:
    - "write to ana@example.com today"
    - "carla.ficticia+orders@sub.example.com"
    - "Reply-To: soporte@example.com"
    - "x@example.com"
    - "user_name-1@mail.example.com,"
    - "<bruno@example.com>"
    - "first.last@example.com."
    - "o'neil@example.com"
    - "MAYUS@EXAMPLE.COM"
    - "id 42: dev@ex-ample.com"
  negatives:
    - "ana at example dot com"
    - "@example.com"
    - "ana@"
    - "ana@localhost"
    - "ana@example"
    - ".ana@example.com"
    - "ana..b@example.com"
    - "price 10@ 3 units"
    - "user@.example.com"
    - "a@b.c"
phone_es:
  positives:
    - "+34 600 000 001"
    - "call 600000002 now"
    - "0034 700 000 003"
    - "+34-800-000-004"
    - "tel: 900 000 005"
    - "600.000.006"
    - "(+34) 611 000 007"
    - "622000008"
    - "+34633000009"
    - "the line 944 000 010 is open"
  negatives:
    - "500 000 001"
    - "100000001"
    - "60000000"
    - "6000000011"
    - "+33 600 000 001"
    - "order 1600000001"
    - "12/06/2026"
    - "4111111111111111"
    - "600 000"
    - "IBAN XX4300000000000000001234"
