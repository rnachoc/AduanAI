apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aduana.fullname" . }}
  labels:
    {{- include "aduana.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aduana.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aduana.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_CONFIG_IMPORT
              value: optional:file:/etc/aduana/config/upstreams.yaml
            - name: ADUANA_POLICY_DIRECTORY
              value: /etc/aduana/policy
            - name: ADUANA_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            - name: ADUANA_DATABASE_USER
              value: {{ .Values.database.user | quote }}
            - name: ADUANA_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: database-password } }
            - name: ADUANA_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: master-key } }
            - name: ADUANA_BOOTSTRAP_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: admin-email } }
            - name: ADUANA_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: admin-password } }
            - name: ADUANA_SECURE_COOKIES
              value: "true"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/aduana/config
              readOnly: true
            - name: policy
              mountPath: /etc/aduana/policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "aduana.fullname" . }}
            items:
              - { key: upstreams.yaml, path: upstreams.yaml }
        - name: policy
          configMap:
            name: {{ include "aduana.fullname" . }}
            items:
              - { key: policy.yaml, path: policy.yaml }
              {{- range $name, $body := .Values.policy.tests }}
              - { key: test-{{ $name }}, path: tests/{{ $name }} }
              {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
