apiVersion: v1
kind: Service
metadata:
  name: {{ include "aduana.fullname" . }}
  labels:
    {{- include "aduana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aduana.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
