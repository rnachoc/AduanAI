extends: default
ignore: |
  **/node_modules/
  **/target/
  **/dist/
  # Helm templates are Go templates, not YAML until rendered; make helm-check renders and lints them.
  deploy/helm/*/templates/
rules:
  line-length:
    max: 140
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
  # Prettier formats the demo YAML with one space inside flow braces and brackets.
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
